openapi: 3.0.3
info:
  title: audit-service
  version: 1.0.0
  description: Servicio centralizado de auditoría para la plataforma

servers:
  - url: http://localhost:9100/api/v1

tags:
  - name: Audit
    description: Registro y consulta de eventos auditables

paths:
  /audit:
    post:
      tags: [Audit]
      summary: Registrar un evento de auditoría
      operationId: createAuditEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventRQ'
      responses:
        '201':
          description: Evento registrado correctamente
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      tags: [Audit]
      summary: Obtener todos los eventos de auditoría
      operationId: getAuditEvents
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventRecord'

components:
  schemas:

    AuditEventRQ:
      type: object
      required: [microservice, action, entity, timestamp]
      properties:
        microservice:
          type: string
        action:
          type: string
        entity:
          type: string
        entityId:
          type: string
        correlationId:
          type: string
        payload:
          type: string
        timestamp:
          type: string
          format: date-time

    AuditEventRecord:
      allOf:
        - $ref: '#/components/schemas/AuditEventRQ'
        - type: object
          properties:
            id:
              type: integer
              format: int64

    ProblemDetail:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
        instance:
          type: string
