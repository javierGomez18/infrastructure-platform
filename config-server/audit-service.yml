server:
  servlet:
    context-path: /api/v1/audit

spring:
  application:
    name: audit-service

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 500ms
