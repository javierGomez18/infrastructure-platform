openapi: 3.0.3
info:
  title: audit-service
  version: 1.0.0
  description: Servicio centralizado de auditoría para la plataforma

servers:
  - url: http://localhost:9100/api/v1

tags:
  - name: Audit
    description: Registro y consulta de eventos auditables

paths:
  /audit:
    post:
      tags: [Audit]
      summary: Registrar un evento de auditoría
      operationId: createAuditEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventRQ'
      responses:
        '201':
          description: Evento registrado correctamente
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailRS'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailRS'

    get:
      tags: [Audit]
      summary: Obtener todos los eventos de auditoría
      operationId: getAuditEvents
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventRecord'

components:
  schemas:
    AuditEventRQ:
      type: object
      required: [microservice, action, entity, timestamp]
      properties:
        microservice:
          type: string
        action:
          type: string
        entity:
          type: string
        entityId:
          type: string
        correlationId:
          type: string
        payload:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    AuditEventRecord:
      allOf:
        - $ref: '#/components/schemas/AuditEventRQ'
        - type: object
          properties:
            id:
              type: integer
              format: int64

    ProblemDetailRS:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - exceptionType
        - timestamp
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de error
        title:
          type: string
          description: Título breve del error
        status:
          type: integer
          format: int32
          description: Código de estado HTTP asociado al error
        detail:
          type: string
          description: Descripción detallada del error
        instance:
          type: string
          format: uri
          description: URI que identifica la instancia específica del error
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo en la que ocurrió el error (YYYY-MM-DDTHH:mm:ss)
        exceptionType:
          type: string
          description: Tipo de excepción (clase) que se lanzó
